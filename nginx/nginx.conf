# ─────────────────────────────────────────────────────────────
# AdTech Platform — Nginx Reverse Proxy
# Routes subdomains to Docker Compose services
# ─────────────────────────────────────────────────────────────

# Retail website  →  shop.yourdomain.com
server {
    listen 80;
    server_name shop.*;

    location / {
        proxy_pass         http://retail-ui:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Marketing dashboard  →  dashboard.yourdomain.com
server {
    listen 80;
    server_name dashboard.*;

    location / {
        proxy_pass         http://dashboard-ui:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}

# Insights API + Swagger  →  api.yourdomain.com
server {
    listen 80;
    server_name api.*;

    location / {
        proxy_pass         http://insights-api:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Allow CORS for dashboard-ui calling from browser
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'X-Tenant-ID,Content-Type' always;
        if ($request_method = OPTIONS) { return 204; }
    }
}

# Event Collector  →  collector.yourdomain.com
server {
    listen 80;
    server_name collector.*;

    location / {
        proxy_pass         http://event-collector:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        if ($request_method = OPTIONS) { return 204; }
    }
}

# Kafka UI  →  kafka.yourdomain.com
server {
    listen 80;
    server_name kafka.*;

    location / {
        proxy_pass         http://kafka-ui:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# Grafana  →  grafana.yourdomain.com
server {
    listen 80;
    server_name grafana.*;

    location / {
        proxy_pass         http://grafana:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}

# Default — catch-all redirect to shop
server {
    listen 80 default_server;
    return 301 http://shop.$host$request_uri;
}
