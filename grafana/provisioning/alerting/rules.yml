apiVersion: 1

groups:

  # ─────────────────────────────────────────────────────────────────
  # Group 1: Event Pipeline Health
  # ─────────────────────────────────────────────────────────────────
  - orgId: 1
    name: Event Pipeline Health
    folder: AdTech Alerts
    interval: 1m
    rules:

      # Alert 1: High event rejection rate (invalid tenant IDs hitting the collector)
      - uid: alert-high-rejection-rate
        title: "High Event Rejection Rate"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: adtech-prometheus
            model:
              expr: rate(events_rejected_total[1m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0.1], type: gt }   # > 0.1 rejections/sec
                  operator:  { type: and }
                  query:     { params: [A] }
                  reducer:   { type: last }
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Event collector is rejecting events at {{ $values.A }}/sec"
          description: >
            Events are being rejected due to invalid tenant IDs.
            Check that the X-Tenant-ID header matches a configured tenant.
        labels:
          severity: warning
          team: platform

      # Alert 2: Pipeline stall — events received but none processed
      - uid: alert-pipeline-stall
        title: "Stream Processor Pipeline Stall"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: adtech-prometheus
            model:
              expr: rate(events_received_total[2m])
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: adtech-prometheus
            model:
              expr: rate(events_processed_total[2m])
              instant: true
              refId: B
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: math
              expression: "$A > 0.5 && $B == 0"
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 3m
        annotations:
          summary: "Events are arriving but stream-processor is not processing them"
          description: >
            Kafka consumer may be lagging or stream-processor is down.
            Check stream-processor logs: docker logs adtech-stream-processor
        labels:
          severity: critical
          team: platform

  # ─────────────────────────────────────────────────────────────────
  # Group 2: API Performance
  # ─────────────────────────────────────────────────────────────────
  - orgId: 1
    name: API Performance
    folder: AdTech Alerts
    interval: 1m
    rules:

      # Alert 3: API p99 latency exceeds 500ms
      - uid: alert-high-p99-latency
        title: "Insights API p99 Latency > 500ms"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: adtech-prometheus
            model:
              expr: >
                histogram_quantile(0.99,
                  sum(rate(http_server_requests_seconds_bucket{job="insights-api"}[2m]))
                  by (le))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0.5], type: gt }   # > 500ms (value is in seconds)
                  operator:  { type: and }
                  query:     { params: [A] }
                  reducer:   { type: last }
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Insights API p99 latency is {{ $values.A | humanizeDuration }}"
          description: >
            The 99th-percentile response time has exceeded 500ms for 2+ minutes.
            Check database query performance and connection pool saturation.
        labels:
          severity: warning
          team: api

      # Alert 4: 5xx server error spike
      - uid: alert-5xx-spike
        title: "Insights API 5xx Error Rate Spike"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: adtech-prometheus
            model:
              expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0.5], type: gt }   # > 0.5 errors/sec
                  operator:  { type: and }
                  query:     { params: [A] }
                  reducer:   { type: last }
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "5xx error rate is {{ $values.A }}/sec"
          description: >
            Server-side errors are elevated. Check service logs for exceptions,
            database connectivity, and Kafka broker availability.
        labels:
          severity: critical
          team: api
